name: Resolve PR 1729 conflicts

on:
  push:
    branches: [pr-assets]
    paths:
      - .github/workflows/resolve-pr1729-conflicts.yml

permissions:
  contents: write

jobs:
  resolve-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Resolve, verify, and push
        run: bash .github/scripts/resolve-pr1729.sh
