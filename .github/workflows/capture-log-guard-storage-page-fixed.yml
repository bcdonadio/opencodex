name: Capture fixed Log Guard Storage screenshots

on:
  push:
    branches: [pr-assets]
    paths:
      - .github/workflows/capture-log-guard-storage-page-fixed.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Capture real Storage page with deterministic API fixtures
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            feat/codex-log-guard-inspect \
            feat/codex-log-guard-protect \
            feat/codex-log-guard-reclaim \
            pr-assets

          mkdir -p /tmp/ocx-log-guard-shots

          capture() {
            local stage="$1"
            local ref="$2"
            local port="$3"

            git checkout --force "origin/${ref}"
            bun install --frozen-lockfile
            (cd gui && bun install --frozen-lockfile)

            cat > gui/pr-screenshot.html <<'HTML'
          <!doctype html>
          <html lang="en" data-theme="dark">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>OpenCodex Storage</title>
              <style>
                html, body, #root { margin: 0; min-height: 100%; background: #1e1e1e; }
                body { box-sizing: border-box; }
                #root { width: 100%; }
                .pr-shot-shell { width: 1180px; margin: 0 auto; padding: 28px 32px 36px; box-sizing: border-box; }
              </style>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/pr-screenshot.jsx"></script>
            </body>
          </html>
          HTML

            cat > gui/src/pr-screenshot.jsx <<'JSX'
          import React from "react";
          import ReactDOM from "react-dom/client";
          import Storage from "./pages/Storage";
          import { LanguageProvider } from "./i18n/provider";
          import "./styles.css";

          const stage = new URLSearchParams(window.location.search).get("stage") || "inspect";
          const MiB = 1024 * 1024;
          const GiB = 1024 * MiB;

          const codexLogs = {
            generatedAt: Date.UTC(2026, 7, 15, 7, 33, 42),
            externalSqliteHome: false,
            snapshot: "checkpointed",
            files: { databaseBytes: 512 * MiB, walBytes: 24 * MiB, shmBytes: 0 },
            schema: { state: "compatible" },
            capabilities: {
              inspection: { state: "supported" },
              protection: { state: "supported" },
              reclaim: { state: "supported" },
            },
            metrics: {
              totalRows: 1284200,
              rowsByLevel: { TRACE: 873256, DEBUG: 96540, INFO: 276314, WARN: 3310, ERROR: 4780 },
              traceRows: 873256,
              traceShare: 0.68,
              topTargets: [
                { target: "codex_api::sse", rows: 611420 },
                { target: "codex_tui::streaming::controller", rows: 129804 },
                { target: "codex_http_client::transport", rows: 72118 },
              ],
              pageSize: 4096,
              pageCount: 131072,
              freelistPages: 32768,
              reclaimableBytes: 128 * MiB,
              estimatedLogBytes: 448 * MiB,
            },
          };

          if (stage !== "inspect") {
            codexLogs.protection = {
              desiredMode: "compat",
              observedMode: "compat",
              state: "active",
            };
          }

          const storageReport = {
            codexHome: "C:\\Users\\ws\\.codex",
            generatedAt: Date.UTC(2026, 7, 15, 7, 33, 42),
            total: { bytes: 2.4 * GiB, fileCount: 387 },
            buckets: [
              { key: "sessions", label: "Active sessions", bytes: 1.4 * GiB, fileCount: 241 },
              { key: "archived_sessions", label: "Archived sessions", bytes: 620 * MiB, fileCount: 101 },
              { key: "logs_db", label: "Logs database", bytes: 512 * MiB, fileCount: 3, rows: 1284200 },
              { key: "state_db", label: "State database", bytes: 74 * MiB, fileCount: 3 },
              { key: "other", label: "Other", bytes: 46, fileCount: 1, largest: [{ path: "config.toml", bytes: 46 }] },
            ],
            codexLogs,
          };

          const cleanupPolicy = {
            enabled: false,
            trigger: { archivedBytesOver: 5 * GiB },
            target: { removeOldestPercent: 25 },
            schedule: "manual",
            mode: "quarantine",
            job: { status: "idle" },
          };

          const jsonResponse = (body, status = 200) => new Response(JSON.stringify(body), {
            status,
            headers: { "content-type": "application/json" },
          });

          globalThis.fetch = async (input) => {
            const raw = typeof input === "string" ? input : input instanceof URL ? input.href : input.url;
            const url = new URL(raw, window.location.origin);
            if (url.pathname === "/api/storage") return jsonResponse(storageReport);
            if (url.pathname === "/api/storage/cleanup-policy") return jsonResponse(cleanupPolicy);
            if (url.pathname === "/api/storage/trash") return jsonResponse({ entries: [] });
            return jsonResponse({ error: "fixture_not_found" }, 404);
          };

          ReactDOM.createRoot(document.getElementById("root")).render(
            <React.StrictMode>
              <LanguageProvider>
                <main className="pr-shot-shell">
                  <Storage apiBase="" />
                </main>
              </LanguageProvider>
            </React.StrictMode>,
          );
          JSX

            cat > /tmp/capture-${stage}.mjs <<'JS'
          import { chromium } from "playwright";

          const url = process.argv[2];
          const out = process.argv[3];
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 1040 }, deviceScaleFactor: 1 });
          await page.goto(url, { waitUntil: "networkidle" });
          await page.getByText("Storage", { exact: true }).waitFor();
          await page.getByText("Logs database", { exact: true }).first().waitFor();
          await page.getByRole("tab", { name: "Policy" }).waitFor();
          await page.getByText("Free up space", { exact: true }).waitFor();
          await page.screenshot({ path: out, fullPage: false });
          await browser.close();
          JS

            (
              cd gui
              bun run dev -- --host 127.0.0.1 --port "$port" > "/tmp/vite-${stage}.log" 2>&1 &
              echo $! > "/tmp/vite-${stage}.pid"
            )

            for _ in $(seq 1 60); do
              if curl -fsS "http://127.0.0.1:${port}/pr-screenshot.html?stage=${stage}" >/dev/null; then
                break
              fi
              sleep 0.5
            done
            curl -fsS "http://127.0.0.1:${port}/pr-screenshot.html?stage=${stage}" >/dev/null

            npx --yes -p playwright@1.55.0 node "/tmp/capture-${stage}.mjs" \
              "http://127.0.0.1:${port}/pr-screenshot.html?stage=${stage}" \
              "/tmp/ocx-log-guard-shots/${stage}.png"

            kill "$(cat "/tmp/vite-${stage}.pid")" || true
            rm -f gui/pr-screenshot.html gui/src/pr-screenshot.jsx "/tmp/capture-${stage}.mjs"
          }

          capture inspect feat/codex-log-guard-inspect 4171
          capture protect feat/codex-log-guard-protect 4172
          capture reclaim feat/codex-log-guard-reclaim 4173

      - name: Publish screenshots to pr-assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add /tmp/pr-assets origin/pr-assets
          cd /tmp/pr-assets
          git checkout -B pr-assets origin/pr-assets
          mkdir -p pr-screenshots/log-guard
          cp /tmp/ocx-log-guard-shots/inspect.png pr-screenshots/log-guard/1727-inspect.png
          cp /tmp/ocx-log-guard-shots/protect.png pr-screenshots/log-guard/1729-protect.png
          cp /tmp/ocx-log-guard-shots/reclaim.png pr-screenshots/log-guard/1732-reclaim.png
          git add pr-screenshots/log-guard
          git commit -m "docs(pr): fix Log Guard Storage screenshots"
          git push origin HEAD:pr-assets
