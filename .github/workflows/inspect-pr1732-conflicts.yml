name: Resolve PR 1732 conflicts

on:
  push:
    branches: [pr-assets]
    paths:
      - .github/workflows/inspect-pr1732-conflicts.yml
      - .github/scripts/inspect-pr1732-conflicts.sh

permissions:
  contents: write

jobs:
  resolve-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Resolve, verify, and push
        run: bash .github/scripts/inspect-pr1732-conflicts.sh
